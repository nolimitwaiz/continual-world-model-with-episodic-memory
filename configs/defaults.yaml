schema_version: 1
project: cmwm

experiment:
  name: prototype1_base
  prototype: cmwm-e1
  run_class: engineering
  seed: 0

scale:
  # These defaults are provisional engineering/pilot values and cannot support a claim.
  active_profile: provisional_engineering
  claim_eligible: false
  confirmatory_reference:
    training_observation_steps: 10000000
    development_episodes: 10000
    test_episodes: 20000
    heldout_families: [HF-A, HF-B]
    seeds: [11, 23, 47, 89, 131]

execution:
  require_slurm: true
  require_cuda: true
  device: cuda
  precision: bf16
  deterministic: true
  deterministic_warn_only: false

paths:
  data_root_env: CMWM_DATA_ROOT
  run_root_env: CMWM_RUN_ROOT
  model_cache_env: CMWM_MODEL_CACHE
  g0_attestation_env: CMWM_G0_ATTESTATION
  development_endpoint_manifest_env: CMWM_DEVELOPMENT_ENDPOINT_MANIFEST

data:
  name: cmwm_synth_e1
  generator_policy: random_v1
  observation_source: oracle_symbolic_state
  split_seed: 1729
  train_episodes: 10000
  validation_episodes: 1000
  test_episodes: 1000
  min_episode_steps: 32
  max_episode_steps: 160
  context_steps: 32
  query_lags: [16, 32, 64, 128]
  split_unit: generator_mechanism
  heldout_families: [HF-A, HF-B]

prototype1:
  state_adapter:
    name: canonical_symbolic
    output_dim: 128
    max_entities: 8
    grid_width: 6
    grid_height: 4
  action_adapter:
    name: canonical_action
    output_dim: 128
  step_fusion:
    name: state_action_concat_projection
    output_dim: 128
  temporal:
    name: gru
    hidden_dim: 128
    layers: 1
  boundary:
    name: none
    threshold: null
    online_only: true
  memory:
    name: none
    capacity_records: 64
    key_dim: 128
    value_dim: 128
    storage_dtype: float32
    metadata_bytes_counted: true
    record_layout:
      vector_bytes: 1024
      metadata_bytes: 40
      record_bytes: 1064
      capacity_bytes: 68096
    retrieval_top_k: 4
    eviction: fifo
  tasks:
    delayed_state_recall: true
    object_location_history: true
    occlusion_continuity: true
    causal_predecessor_recall: true

training:
  # Engineering/pilot values. Confirmatory scale is frozen only after profiling.
  max_steps: 20000
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  num_workers: 4
  eval_every_steps: 500
  checkpoint_every_steps: 1000
  resume: true

evaluation:
  primary_metric: long_delay_memory_score
  confirmatory_seeds: [11, 23, 47, 89, 131]
  boundary_tolerance_steps: 1
  report_resource_metrics: true

gates:
  oracle_absolute_gain: 0.05
  oracle_relative_error_reduction: 0.20
  learned_oracle_gain_recovery: 0.75
  learned_boundary_f1: 0.80
  visual_uplift_retention: 0.50
  max_inference_cost_ratio: 1.25

artifacts:
  save_predictions: true
  save_best_checkpoint: true
  save_last_checkpoint: true
