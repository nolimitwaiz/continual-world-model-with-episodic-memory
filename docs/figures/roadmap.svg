<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-label="Proposed continual world model">
<title>Proposed continual world model</title><desc>Research target — dashed modules and connections are not completed-system evidence.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#607083"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172C43} .small{fill:#526579}</style>
<rect width="1100" height="630" fill="#FFFFFF"/>
<text x="36" y="42" font-size="26" font-weight="700" text-anchor="start" style="fill:#172C43">Proposed continual world model</text>
<text x="36" y="72" font-size="16" font-weight="400" text-anchor="start" style="fill:#526579">Research target — dashed modules and connections are not completed-system evidence.</text>
<rect x="36" y="125" width="290" height="84" rx="6" fill="#F0F4F8" stroke="#A7B9C8" stroke-dasharray="7 5"/>
<text x="51" y="156" font-size="19" font-weight="700" text-anchor="start" style="fill:#172C43">Multimodal perception</text>
<text x="51" y="184" font-size="15" font-weight="400" text-anchor="start" style="fill:#526579">Text, speech and visual interfaces</text>
<rect x="400" y="125" width="290" height="84" rx="6" fill="#F0F4F8" stroke="#A7B9C8" stroke-dasharray="7 5"/>
<text x="415" y="156" font-size="19" font-weight="700" text-anchor="start" style="fill:#172C43">World-state dynamics</text>
<text x="415" y="184" font-size="15" font-weight="400" text-anchor="start" style="fill:#526579">Maintain and predict hidden state</text>
<rect x="764" y="125" width="300" height="84" rx="6" fill="#F0F4F8" stroke="#A7B9C8" stroke-dasharray="7 5"/>
<text x="779" y="156" font-size="19" font-weight="700" text-anchor="start" style="fill:#172C43">Event detection</text>
<text x="779" y="184" font-size="15" font-weight="400" text-anchor="start" style="fill:#526579">Learn online boundary decisions</text>
<line x1="326" y1="167" x2="390" y2="167" stroke="#DCE4EA" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<line x1="690" y1="167" x2="754" y2="167" stroke="#DCE4EA" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="764" y="310" width="300" height="84" rx="6" fill="#E7F4F2" stroke="#A7B9C8" stroke-dasharray="7 5"/>
<text x="779" y="341" font-size="19" font-weight="700" text-anchor="start" style="fill:#172C43">Episodic memory</text>
<text x="779" y="369" font-size="15" font-weight="400" text-anchor="start" style="fill:#526579">Write + reactivate related episodes</text>
<rect x="400" y="310" width="290" height="84" rx="6" fill="#F0F4F8" stroke="#A7B9C8" stroke-dasharray="7 5"/>
<text x="415" y="341" font-size="19" font-weight="700" text-anchor="start" style="fill:#172C43">Fast parameter adaptation</text>
<text x="415" y="369" font-size="15" font-weight="400" text-anchor="start" style="fill:#526579">Update an explicit fast-weight set</text>
<rect x="36" y="310" width="290" height="84" rx="6" fill="#F0F4F8" stroke="#A7B9C8" stroke-dasharray="7 5"/>
<text x="51" y="341" font-size="19" font-weight="700" text-anchor="start" style="fill:#172C43">Replay and consolidation</text>
<text x="51" y="369" font-size="15" font-weight="400" text-anchor="start" style="fill:#526579">Select experiences for learning</text>
<line x1="914" y1="209" x2="914" y2="300" stroke="#DCE4EA" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<line x1="764" y1="352" x2="700" y2="352" stroke="#DCE4EA" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<line x1="400" y1="352" x2="336" y2="352" stroke="#DCE4EA" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="36" y="480" width="290" height="84" rx="6" fill="#F0F4F8" stroke="#A7B9C8" stroke-dasharray="7 5"/>
<text x="51" y="511" font-size="19" font-weight="700" text-anchor="start" style="fill:#172C43">Slow parameter learning</text>
<text x="51" y="539" font-size="15" font-weight="400" text-anchor="start" style="fill:#526579">Acquire cross-episode structure</text>
<line x1="181" y1="394" x2="181" y2="470" stroke="#DCE4EA" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<polyline points="36,522 18,522 18,245 470,245 470,219" fill="none" stroke="#607083" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<polyline points="1064,352 1080,352 1080,245 620,245 620,219" fill="none" stroke="#607083" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="400" y="490" font-size="21" font-weight="700" text-anchor="start" style="fill:#172C43">State writes ≠ fast-weight updates</text>
<text x="400" y="524" font-size="17" font-weight="400" text-anchor="start" style="fill:#172C43">Test memory, adaptation and replay separately.</text>
<text x="36" y="598" font-size="16" font-weight="400" text-anchor="start" style="fill:#172C43">The implemented symbolic subset is shown in the separate prototype diagram.</text>
</svg>
